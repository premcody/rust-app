apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-app
  labels:
    app: rust-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-app
  template:
    metadata:
      labels:
        app: rust-app
    spec:
      containers:
        - name: rust-app
          # Image is overwritten at deploy time by the pipeline using kubectl set image
          image: localhost:5001/rust-app:latest
          ports:
            - containerPort: 8080
