apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-app
  labels:
    app: rust-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-app
  template:
    metadata:
      labels:
        app: rust-app
    spec:
      containers:
        - name: rust-app
          image: kind-registry:5000/rust-app:latest
          imagePullPolicy: Always    # always pull fresh image, never use node cache
          ports:
            - containerPort: 8080
          readinessProbe:            # pod only gets traffic when this passes
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:             # restart pod if this fails
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
